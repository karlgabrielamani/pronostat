<style>
.mp { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.mp-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mp-h b { font-size: 15px; }
.mp-picks { display: flex; gap: 8px; flex-wrap: wrap; }
.mp-picks button { flex: 1 1 0; min-width: 0; min-height: 44px; font: inherit; font-weight: 700; font-size: 14px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); cursor: pointer; padding: 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mp-picks button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.mp-com { font-size: 13px; color: var(--ink-3); }
.mp-com b { color: var(--ink); }
.mp-share { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--hot); color: #fff; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
.shv { position: fixed; inset: 0; z-index: 70; background: rgba(10,14,22,.72); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.shv[hidden] { display: none; }
.shv-box { position: relative; background: var(--surface); border-radius: 18px; padding: 14px; width: min(420px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 12px; }
.shv-box img { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }
.shv-row { display: flex; gap: 8px; flex-wrap: wrap; }
.shv-row a, .shv-row button { flex: 1 1 0; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; font: inherit; font-weight: 700; font-size: 14px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; padding: 0 12px; white-space: nowrap; }
.shv-row .main { background: var(--hot); border-color: var(--hot); color: #fff; }
.shv-x { position: absolute; top: -14px; right: -10px; width: 38px; height: 38px; border-radius: 50%; border: 2px solid #fff; background: #14161A; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; }
.shv-th { display: flex; gap: 4px; background: var(--track, #F1F2F4); border-radius: 12px; padding: 4px; }
.shv-th button { flex: 1; font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 9px; padding: 9px; background: transparent; color: var(--ink-2, #4B5563); cursor: pointer; }
.shv-th button[aria-pressed="true"] { background: #fff; color: var(--ink, #14161A); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
</style>
<script>
// ---------- Mon prono, vote des joueurs et image à partager ----------
(() => {
  const SITE = "https://karlgabrielamani.github.io/pronostat/";
  // Vote des joueurs : base Supabase (adresse du projet + clé publique « anon »). Vide = le vote des joueurs ne s'affiche pas.
  const MIN_VOTES = 30;
  const VOTE = { url: "https://mueldojterubckckwytm.supabase.co", key: "sb_publishable_bIVh_e0es-Ppb47ZjKtNJg_vIO-teLy" };
  const tr = s => (window.I18N ? window.I18N.tr(s) : s);
  const ICO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
  const $ = id => document.getElementById(id);
  const txt = id => ($(id) ? $(id).textContent.trim() : "");
  const num = s => parseFloat(String(s).replace(",", ".").replace(/[^\d.]/g, "")) / 100 || 0;
  const load = () => { try { return JSON.parse(localStorage.getItem("pronostat-picks") || "{}"); } catch (e) { return {}; } };
  const save = o => { try { localStorage.setItem("pronostat-picks", JSON.stringify(o)); } catch (e) {} };
  const week = () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const w1 = new Date(d.getFullYear(), 0, 4); return d.getFullYear() + "-W" + (1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7)); };
  const evs = sel => [...document.querySelectorAll(sel)].map(el => { const q = el.querySelector(".q"); const lab = [...el.querySelectorAll("span")].find(s => !s.classList.contains("q")); return lab && q ? [lab.textContent.trim(), num(q.textContent)] : null; }).filter(Boolean);
  const pickEvents = (list, a, b) => {
    const skip = new RegExp("^(" + [a, b].map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\s+(gagne|wins|wint)$");
    const c = list.map(([l, p]) => [tr(l), p]).filter(([l, p]) => p >= .52 && p <= .88 && !skip.test(l) && !/ (ou nul|or draw|of gelijk)$/.test(l) && !/^(But en|Goal in the|Doelpunt in de)|1[,.]5 (but|goal|doelpunt)/.test(l)).sort((x, y) => y[1] - x[1]);
    const out = [], seen = new Set();
    for (const e of c) { const k = e[0].replace(/\d+[,.]?\d*/g, "#"); if (seen.has(k)) continue; seen.add(k); out.push(e); if (out.length === 3) break; }
    return out;
  };
  const SPOTS = [
    { sport: "Football", res: "ftResult", anchor: "ftVerdict", data: () => ({ comp: (window.FootAPI && FootAPI.current() || {}).comp || "", a: txt("ftNA"), b: txt("ftNB"), p: [num(txt("ftPH")), num(txt("ftPD")), num(txt("ftPA"))], ev: evs("#ftEv label"), sel: evs("#ftEv label:has(input:checked)"), selTxt: txt("ftSel") }) },
    { sport: "NBA", res: "nbResult", anchor: "nbVerdict", data: () => ({ comp: "NBA", a: txt("nbNA"), b: txt("nbNB"), p: [num(txt("nbWA")), 0, num(txt("nbWB"))], ev: evs("#nbEv label"), sel: evs("#nbEv label:has(input:checked)"), selTxt: txt("nbSel") }) },
    { sport: "Tennis", res: "result", anchor: "verdict", data: () => ({ comp: "Tennis", a: txt("nA"), b: txt("nB"), p: [num(txt("wA")), 0, num(txt("wB"))], ev: evs("#evList label"), sel: evs("#evList label:has(input:checked)"), selTxt: txt("cbSel") }) },
  ];

  // ---- vote des joueurs (optionnel)
  const api = (path, body) => fetch(VOTE.url + path, { method: "POST", headers: { apikey: VOTE.key, "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify(body) });
  async function counts(key) { if (!VOTE.url) return null; try { const r = await api("/rest/v1/rpc/vote_counts", { m: key }); return r.ok ? await r.json() : null; } catch (e) { return null; } }
  async function vote(key, pick) { if (!VOTE.url) return; try { await api("/rest/v1/votes", { match: key, pick }); } catch (e) {} }

  function mount(S) {
    const res = $(S.res), anc = $(S.anchor); if (!res || !anc) return;
    const box = document.createElement("div"); box.className = "mp";
    anc.insertAdjacentElement("afterend", box);
    let lastKey = "";
    const draw = async () => {
      const D = S.data(); if (!D.a || !D.b) return;
      const key = [S.sport, D.a, D.b, week()].join("|"); if (key === lastKey && box.childElementCount) return; lastKey = key;
      const picks = load(), mine = picks[key];
      const opts = S.sport === "Football" ? [["1", D.a], ["N", "Nul"], ["2", D.b]] : [["1", D.a], ["2", D.b]];
      box.innerHTML = `<div class="mp-h"><b>Votre prono</b><button type="button" class="mp-share">${ICO}Partager</button></div>
        <div class="mp-picks">${opts.map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${mine === k}">${l}</button>`).join("")}</div><div class="mp-com"></div>`;
      const com = box.querySelector(".mp-com"); let C = null;
      const showCounts = async () => {
        const c = await counts(key); if (!c || !c.length) { com.textContent = ""; C = null; return; }
        const n = c.reduce((s, r) => s + r.n, 0), get = k => (c.find(r => r.pick === k) || { n: 0 }).n / n;
        C = { n, get };
        com.innerHTML = n >= MIN_VOTES ? `Votants Pronolink : ${opts.map(([k, l]) => `<b>${l} ${Math.round(get(k) * 100)} %</b>`).join(" · ")} (${n} votes)` : `${n} ${n > 1 ? "votes" : "vote"} pour l'instant`;
      };
      box.querySelector(".mp-picks").onclick = e => {
        const bt = e.target.closest("button"); if (!bt) return;
        const p = load(); const first = !p[key]; p[key] = bt.dataset.k; save(p);
        box.querySelectorAll(".mp-picks button").forEach(x => x.setAttribute("aria-pressed", x === bt));
        if (first) vote(key, bt.dataset.k).then(showCounts); else showCounts();
      };
      box.querySelector(".mp-share").onclick = () => {
        const m = load()[key];
        if (!m) { com.innerHTML = "<b>Choisissez d'abord votre prono.</b>"; const pk = box.querySelector(".mp-picks"); pk.animate([{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 300 }); return; }
        share(S, S.data(), m, opts, C);
      };
      if (mine) showCounts();
    };
    new MutationObserver(() => requestAnimationFrame(draw)).observe(anc, { childList: true, characterData: true, subtree: true });
    draw();
  }

  // ---- l'image à partager : deux thèmes, « blanc » (comme l'app) et « rouge » (inversé)
  const THEME = "blanc";
  async function card(S, D, mine, opts, C, theme) {
    const RED = theme === "rouge", W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");
    try { if (!document.getElementById("shFont")) { const l = document.createElement("link"); l.id = "shFont"; l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Inter:wght@600;700;800&display=swap"; document.head.appendChild(l); await new Promise(r => { l.onload = r; l.onerror = r; setTimeout(r, 2500); }); } await Promise.all(["800 120px Inter", "600 40px Inter", '800 54px "Bricolage Grotesque"'].map(f => document.fonts.load(f))); } catch (e) {}
    const F = (w, z) => `${w} ${z}px Inter, "Helvetica Neue", Arial, sans-serif`;
    const up = t => String(t).toLocaleUpperCase(window.I18N && I18N.lang === "nl" ? "nl" : "fr");
    const fit = (t, max, w, z, min = 20) => { x.font = F(w, z); while (x.measureText(t).width > max && z > min) { z -= 2; x.font = F(w, z); } return z; };
    const rr = (X, Y, w, h, r, col) => { x.beginPath(); x.roundRect(X, Y, w, h, r); x.fillStyle = col; x.fill(); };
    const INK = RED ? "#FFFFFF" : "#14161A", SUB = RED ? "rgba(255,255,255,.82)" : "#5B6270", ACC = RED ? "#FFFFFF" : "#D0202E", L = 60;
    x.fillStyle = RED ? "#D0202E" : "#FFFFFF"; x.fillRect(0, 0, W, H);
    if (!RED) { x.fillStyle = "#D0202E"; x.beginPath(); x.moveTo(W, H - 200); x.lineTo(W, H); x.lineTo(W - 200, H); x.closePath(); x.fill(); }
    // en-tête : logo P + compétition
    rr(L, 56, 78, 78, 20, RED ? "#FFFFFF" : "#D0202E"); const BG = '800 56px "Bricolage Grotesque", Inter, sans-serif';
    x.textBaseline = "middle"; x.font = BG; x.textAlign = "center"; x.fillStyle = RED ? "#D0202E" : "#FFFFFF"; x.fillText("P", L + 39, 97);
    x.textAlign = "left"; x.fillStyle = INK; x.font = '800 52px "Bricolage Grotesque", Inter, sans-serif'; x.fillText("Pronolink", L + 96, 96);
    const comp = D.comp || S.sport; x.font = F(700, 28); const cw = Math.min(x.measureText(comp).width + 44, 420);
    rr(W - L - cw, 72, cw, 52, 26, RED ? "rgba(255,255,255,.18)" : "#EEF0F3"); x.fillStyle = RED ? "#FFFFFF" : "#3A404B"; x.textAlign = "center"; fit(comp, cw - 30, 700, 28, 16); x.fillText(comp, W - L - cw / 2, 99);
    x.textBaseline = "alphabetic"; x.textAlign = "left";
    // la question
    const pi = mine === "1" ? 0 : mine === "N" ? 1 : 2, pl = pi === 1 ? tr("Match nul") : `${pi === 0 ? D.a : D.b} ${tr("gagne")}`;
    const q = `${tr("Qui gagne")} ${D.a} – ${D.b} ?`;
    let z = 100, lines;
    const wrap = () => { x.font = F(800, z); const out = [""]; for (const w of q.split(" ")) { const t = (out[out.length - 1] + " " + w).trim(); if (x.measureText(t).width > W - 2 * L && out[out.length - 1]) out.push(w); else out[out.length - 1] = t; } return out; };
    const nsel = (D.sel || []).length, maxL = nsel ? 2 : 3;
    while ((lines = wrap()).length > maxL && z > 50) z -= 4;
    let y = 215;
    lines.forEach((ln, k) => { y += z * 1.05; x.font = F(800, z); x.fillStyle = INK; const last = k === lines.length - 1 && ln.endsWith("?");
      const t = last ? ln.slice(0, -1) : ln; x.fillText(t, L, y); if (last) { x.fillStyle = "#D0202E"; x.fillText("?", L + x.measureText(t).width, y); } });
    // les chances selon Pronolink : barre unique, le prono du joueur en rouge
    const parts = S.sport === "Football" ? [[D.a, D.p[0], 0], [tr("Nul"), D.p[1], 1], [D.b, D.p[2], 2]] : [[D.a, D.p[0], 0], [D.b, D.p[2], 2]];
    y += 64; x.fillStyle = SUB; x.font = F(700, 26); x.fillText(up(tr("selon Pronolink")), L, y); y += 22;
    { const n = parts.length, gap = 8, avail = W - 2 * L - gap * (n - 1), tot = parts.reduce((t, q) => t + Math.max(q[1], .12), 0); let bx = L; const BH = 104;
      parts.forEach(([l, p, k], i) => { const w = avail * Math.max(p, .12) / tot, on = k === pi, r = 26, rs = 8;
        x.beginPath(); x.roundRect(bx, y, w, BH, i === 0 ? [r, rs, rs, r] : i === n - 1 ? [rs, r, r, rs] : rs); x.fillStyle = on ? "#D0202E" : (n === 3 && i === 1 ? "#E2E4E8" : "#F1F2F4"); x.fill();
        x.fillStyle = on ? "#FFFFFF" : "#14161A"; x.font = F(800, n === 3 ? 40 : 46); x.textAlign = i === 0 ? "left" : i === n - 1 ? "right" : "center";
        x.fillText(Math.round(p * 100) + " %", i === 0 ? bx + 26 : i === n - 1 ? bx + w - 26 : bx + w / 2, y + BH / 2 + 15);
        x.fillStyle = on ? "#14161A" : "#5B6270"; fit(l, w - 10, 700, 28, 14); x.fillText(l, i === 0 ? bx + 4 : i === n - 1 ? bx + w - 4 : bx + w / 2, y + BH + 42); x.textAlign = "left"; bx += w + gap; });
      y += BH + 42; }
    // mon prono, dans un encadré rose
    y += 50; const BXH = 120; rr(L, y, W - 2 * L, BXH, 28, "#FDECEE");
    x.font = F(800, 28); const mp = up(tr("Mon prono")), mw = x.measureText(mp).width + 32; rr(L + 30, y + (BXH - 54) / 2, mw, 54, 12, "#D0202E"); x.fillStyle = "#FFFFFF"; x.fillText(mp, L + 46, y + BXH / 2 + 10);
    x.fillStyle = "#14161A"; fit(pl, W - 2 * L - mw - 90, 800, 50, 26); x.fillText(pl, L + 30 + mw + 24, y + BXH / 2 + 17); y += BXH;
    // + mon combiné
    const sel = (D.sel || []).map(([l, p]) => [tr(l), p]).slice(0, 3);
    if (sel.length) {
      y += 60; x.fillStyle = SUB; x.font = F(700, 26); x.fillText("+ " + up(tr("Mon combiné")), L, y); y += 22;
      sel.forEach(([l, p]) => { rr(L, y, W - 2 * L, 72, 18, "#F4F5F7"); x.fillStyle = INK; fit(l, W - 2 * L - 220, 700, 30, 18); x.fillText(l, L + 30, y + 47);
        x.fillStyle = "#D0202E"; x.font = F(800, 36); x.textAlign = "right"; x.fillText(Math.round(p * 100) + " %", W - L - 30, y + 49); x.textAlign = "left"; y += 82; });
      const mm = String(D.selTxt || "").match(/(\d+(?:[.,]\d+)?)\s*%/), pj = sel.length > 1 && mm ? parseFloat(mm[1].replace(",", ".")) / 100 : 0;
      if (pj) { x.fillStyle = SUB; x.font = F(700, 28); x.fillText(up(tr("Ensemble")) + " : " + Math.round(pj * 100) + " %", L, y + 30); y += 44; }
    }
    // appel
    const cta = tr("Votez vous aussi sur Pronolink."), cy = nsel ? Math.min(y + 80, 1262) : Math.min(Math.max(y + 110, 1150), 1240); x.font = F(700, 42); x.fillStyle = SUB;
    const k2 = cta.lastIndexOf("Pronolink"); if (k2 > 0) { const a1 = cta.slice(0, k2); x.fillText(a1, L, cy); x.fillStyle = INK; x.font = F(800, 42); x.fillText(cta.slice(k2), L + (x.font = F(700, 42), x.measureText(a1).width), cy); } else x.fillText(cta, L, cy);
    x.fillStyle = SUB; x.font = F(600, 28); x.textAlign = "center"; x.fillText(SITE.replace(/^https:\/\//, "").replace(/\/$/, ""), W / 2, 1306);
    return new Promise(r => c.toBlob(r, "image/png"));
  }

  let ov = null;
  async function share(S, D, mine, opts, C) {
    const pick = (opts.find(o => o[0] === mine) || [0, ""])[1];
    const text = `${D.a} – ${D.b} · ${tr("Mon prono")} : ${pick}. ${tr("Et vous ?")} ${SITE}`;
    if (!ov) { ov = document.createElement("div"); ov.className = "shv"; ov.hidden = true; document.body.appendChild(ov); ov.addEventListener("click", e => { if (e.target === ov) ov.hidden = true; }); }
    let blob = null, url = null, file = null;
    const draw = async () => {
      blob = await card(S, D, mine, opts, C, THEME); if (!blob) return;
      if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(blob); file = new File([blob], "pronolink.png", { type: "image/png" });
      const can = !!(navigator.canShare && navigator.canShare({ files: [file] }));
      ov.innerHTML = `<div class="shv-box" role="dialog" aria-label="Partager">
        <img alt="" src="${url}">
        <div class="shv-row">${can ? `<button type="button" class="main" data-a="share">Partager</button>` : `<a class="main" href="${url}" download="pronolink.png">Télécharger l'image</a>`}</div>
        <button type="button" class="shv-x" data-a="close" aria-label="Fermer">×</button></div>`;
      ov.hidden = false;
      ov.querySelector('[data-a="close"]').onclick = () => { ov.hidden = true; };
      const sb = ov.querySelector('[data-a="share"]'); if (sb) sb.onclick = async () => { try { await navigator.share({ files: [file], text }); ov.hidden = true; } catch (e) {} };
    };
    await draw();
  }
  SPOTS.forEach(mount);
})();
</script>
