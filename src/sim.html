<script>
// ---------- Simulation du match (foot, tennis, NBA), façon retransmission ----------
(() => {
  const CH = "#3D7BEA", CA = "#F2B526";
  const tr = s => (window.I18N ? window.I18N.tr(s) : s);
  const pc = x => Math.round(x * 100) + " %";
  const pmf = (k, l) => { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; };
  const poisson = l => { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const erf = x => { const t = 1 / (1 + .3275911 * Math.abs(x)), y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; };
  const Phi = z => .5 * (1 + erf(z / Math.SQRT2));
  function fprobs(lh, la, gh, ga) {
    let H = 0, D = 0, A = 0, tot = 0;
    for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++) { const q = pmf(i, lh) * pmf(j, la); tot += q; const x = i + gh, y = j + ga; if (x > y) H += q; else if (x === y) D += q; else A += q; }
    return [H / tot, D / tot, A / tot];
  }
  const short = n => { const s = String(n).trim().split(" "); return /\.$/.test(s[s.length - 1]) && s.length > 1 ? s.slice(0, -1).join(" ") : s[s.length - 1]; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const IC = {
    play: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>',
    pause: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    again: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>',
    big: '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>'
  };

  // ---------- dessin en perspective ----------
  function Stage(cv, o) {
    const ctx = cv.getContext("2d");
    let W = 0, H = 0, pr = null;
    const resize = () => {
      const w = cv.parentNode.clientWidth || 340, h = Math.round(w * (w < 520 ? o.ratio[0] : o.ratio[1])), d = window.devicePixelRatio || 1;

      cv.width = w * d; cv.height = h * d; cv.style.height = h + "px"; ctx.setTransform(d, 0, 0, d, 0, 0);
      const cw = W * o.cw, top = o.top * H, bot = o.bot * H, hh = H - top - bot, g = o.g;
      pr = (u, v, z = 0) => { const vv = v * (1 + g) / (1 + g * v), s = o.far + (1 - o.far) * vv; return [W / 2 + (u - .5) * cw * s, top + hh * vv - z * s * cw / o.m * .85, s]; };
    };
    resize();
    const path = pts => { ctx.beginPath(); pts.forEach((p, i) => { const [x, y] = pr(p[0], p[1], p[2] || 0); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); };
    const S = {
      ctx, get W() { return W; }, get H() { return H; }, p: (u, v, z) => pr(u, v, z), resize,
      line(pts, c, w) { path(pts); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); },
      fill(pts, c) { path(pts); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); },
      rect: (u0, v0, u1, v1) => [[u0, v0], [u1, v0], [u1, v1], [u0, v1], [u0, v0]],
      arc: (cu, cv2, ru, rv, a0, a1, n = 40) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cu + ru * Math.cos(a), cv2 + rv * Math.sin(a)]; }),
      shadow(u, v, r) { const [x, y, s] = pr(u, v); ctx.beginPath(); ctx.ellipse(x, y + 1, r * s * 1.1, r * s * .45, 0, 0, 7); ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fill(); },
      player(u, v, col, label, hl, r0 = 9) {
        const [x, y, s] = pr(u, v), r = Math.max(6, r0 * s * W / 380);
        ctx.beginPath(); ctx.ellipse(x, y + 1, r * 1.05, r * .42, 0, 0, 7); ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fill();
        const cy = y - r * .9;
        if (hl) { ctx.beginPath(); ctx.arc(x, cy, r + 4, 0, 7); ctx.fillStyle = "rgba(247,224,74,.35)"; ctx.fill(); }
        ctx.beginPath(); ctx.arc(x, cy, r, 0, 7); ctx.fillStyle = col; ctx.fill();

      },
      ball(u, v, z, col, r0, edge) {
        const [gx, gy, s] = pr(u, v), r = Math.max(2.5, r0 * s * W / 380);
        ctx.beginPath(); ctx.ellipse(gx, gy, r, r * .45, 0, 0, 7); ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fill();
        const [x, y] = pr(u, v, z); ctx.beginPath(); ctx.arc(x, y - r, r, 0, 7); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = edge; ctx.stroke();
      },
      call(u, v, z, who, what, col) { // étiquette d'action façon télé
        if (!what) return;
        const [x0, y0] = pr(u, v, z); ctx.font = "700 11px Quicksand, system-ui, sans-serif";
        const A = String(who || "").toUpperCase(), B = String(what).toUpperCase(), wa = A ? ctx.measureText(A).width + 16 : 0, wb = ctx.measureText(B).width + 16, h = 20, tw = wa + wb;
        let x = Math.min(Math.max(x0 - tw / 2, 6), W - tw - 6), y = Math.max(6, y0 - 46);
        const sk = 5, box = (bx, bw, c) => { ctx.beginPath(); ctx.moveTo(bx + sk, y); ctx.lineTo(bx + bw + sk, y); ctx.lineTo(bx + bw - sk, y + h); ctx.lineTo(bx - sk, y + h); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); };
        ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 10;
        if (A) box(x, wa, "#0A1122"); box(x + wa, wb, col); ctx.shadowBlur = 0;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        if (A) { ctx.fillStyle = "#fff"; ctx.fillText(A, x + wa / 2, y + h / 2 + .5); }
        ctx.fillStyle = col === CA ? "#0A1122" : "#fff"; ctx.fillText(B, x + wa + wb / 2, y + h / 2 + .5);
      }
    };
    return S;
  }

  // ---------- coque commune : tableau de score, chances, scène, bandeau, commandes, stats ----------
  function shell(el, P, o) {
    el.innerHTML = `${o.pre || ""}<div class="bx" style="--c:${CH}">
        <div class="bx-hd"></div>
        <div class="bx-wp"><i class="h">50 %</i><div class="bx-tr"><span class="lb">Chances de victoire</span><span class="fh"></span><span class="fa"></span><span class="mk"></span></div><i class="a">50 %</i></div>
        <div class="bx-stage"><canvas></canvas><button class="bx-play" aria-label="Lecture">${IC.big}</button></div>
        <div class="bx-tick"><b class="bx-chip"></b><span></span></div></div>
      <div class="bx-ctl"><button class="main" data-a="go" aria-label="Lecture">${IC.play}</button><button data-a="spd" aria-label="Vitesse">1×</button><button data-a="rs" aria-label="Rejouer">${IC.again}</button></div>
      <div class="bx-stats"></div>
      <div class="bx-many"><button data-a="many">Simuler 10 000 matchs</button><div class="bx-mres"></div></div>`;
    const q = s => el.querySelector(s);
    const st = Stage(q("canvas"), o.stage);
    const R = { q, st, speed: 1, run: false, call: null, raf: 0, acc: 0, last: 0 };
    R.hd = html => { q(".bx-hd").innerHTML = html; };
    R.wp = (ph, pa, mid) => {
      q(".bx-wp i.h").textContent = pc(ph); q(".bx-wp i.a").textContent = pc(pa);
      q(".bx-tr .fh").style.width = ph * 100 + "%"; q(".bx-tr .fa").style.width = pa * 100 + "%";
      q(".bx-tr .mk").style.left = (ph + (1 - ph - pa) / 2) * 100 + "%";
      q(".bx-tr .lb").textContent = mid || "Chances de victoire";
    };
    R.tick = (who, col, txt) => { const c = q(".bx-chip"); c.textContent = who || ""; c.hidden = !who; c.style.setProperty("--cc", col || "#fff"); q(".bx-tick span").textContent = txt || ""; };
    R.flash = (txt, col) => { const f = document.createElement("div"); f.className = "bx-flash"; f.textContent = txt; f.style.color = col || "#fff"; f.style.animationDuration = (1 / Math.sqrt(R.speed)) + "s"; q(".bx-stage").appendChild(f); setTimeout(() => f.remove(), 1100); };
    R.bump = sel => { const e = q(sel); if (!e) return; e.classList.remove("up"); void e.offsetWidth; e.classList.add("up"); };
    R.stats = rows => {
      q(".bx-stats").innerHTML = rows.map(([l, h, a, fmt]) => {
        const t = h + a || 1, f = fmt || (x => x);
        return `<div class="bx-row"><b>${f(h)}</b><span class="bx-bar l"><i style="width:${h / t * 100}%"></i></span><em>${l}</em><span class="bx-bar r"><i style="width:${a / t * 100}%"></i></span><b>${f(a)}</b></div>`;
      }).join("");
    };
    R.setCall = (u, v, z, who, what, col, ms = 1700) => { R.call = { u, v, z, who, what: tr(what), col, until: performance.now() + ms / Math.max(1, R.speed * .6) }; };
    const btn = () => { const g = q('[data-a="go"]'); g.innerHTML = R.run ? IC.pause : IC.play; g.setAttribute("aria-label", R.run ? "Pause" : "Lecture"); q(".bx-play").hidden = R.run || R.started; };

    const loop = now => {
      R.raf = requestAnimationFrame(loop);

      if (R.run) { R.acc += dt * R.speed; while (R.acc >= o.base && R.run) { R.acc -= o.base; o.step(); } }
      st.resize(); o.draw(now);
      if (R.call && now < R.call.until) st.call(R.call.u, R.call.v, R.call.z, R.call.who, R.call.what, R.call.col);
    };
    q(".bx-play").onclick = () => { o.start(); R.setRun(true); };
    q('[data-a="go"]').onclick = () => { if (!R.run) o.start(); R.setRun(!R.run); };
    q('[data-a="rs"]').onclick = () => { o.reset(); R.started = false; o.start(); R.setRun(true); };
    q('[data-a="spd"]').onclick = e => { R.speed = R.speed === 1 ? 2 : R.speed === 2 ? 4 : 1; e.currentTarget.textContent = R.speed + "×"; };
    q('[data-a="many"]').onclick = () => { q(".bx-mres").innerHTML = o.many(); };
    R.begin = () => { btn(); R.raf = requestAnimationFrame(loop); return () => cancelAnimationFrame(R.raf); };
    return R;
  }
  // déplacement fluide vers une cible
  const ease = (e, k) => { e.u += (e.tu - e.u) * k; e.v += (e.tv - e.v) * k; };
  // trajectoire du ballon (de A à B avec une hauteur maximale)
  const fly = (b, u, v, peak, ms, R, z1 = 0) => { b.fu = b.u; b.fv = b.v; b.fz = b.z || 0; b.tu = u; b.tv = v; b.tz = z1; b.peak = peak; b.t0 = performance.now(); b.dur = ms / R.speed; };
  const ballAt = (b, now) => {
    const k = b.dur ? Math.min(1, (now - b.t0) / b.dur) : 1;
    b.u = b.fu + (b.tu - b.fu) * k; b.v = b.fv + (b.tv - b.fv) * k; b.z = b.fz + (b.tz - b.fz) * k + 4 * b.peak * k * (1 - k);
    return k;
  };

  // ================= FOOT =================
  function foot(el, P) {
    const S = { absH: false, absA: false };
    const pre = `<div class="bx-if"><span class="sm-l">Et si…</span>
      <button class="chip-t" data-k="absH" aria-pressed="false">${esc(P.h)} sans son meilleur buteur</button>
      <button class="chip-t" data-k="absA" aria-pressed="false">${esc(P.a)} sans son meilleur buteur</button></div>`;
    const lams = () => { let h = P.lh, a = P.la; if (S.absH) { h *= .86; a *= 1.04; } if (S.absA) { a *= .86; h *= 1.04; } return [h, a]; };
    let G;
    const fresh = () => ({ t: 0, hs: 0, as: 0, poss: 0, holder: 9, pause: 0, half: false, done: false, sh: [0, 0], on: [0, 0], cor: [0, 0], pt: [0, 0], ball: { u: .5, v: .5, z: 0, fu: .5, fv: .5, fz: 0, tu: .5, tv: .5, tz: 0, peak: 0, t0: 0, dur: 0 }, pl: Array.from({ length: 22 }, () => ({ u: .5, v: .5, tu: .5, tv: .5 })), lp: null });
    // positions : home (0-10) attaque vers la droite
    const pos = (i, t, poss) => {

      st.line([[U(1.37), V(5.485)], [U(9.6), V(5.485)]], w, lw); st.line([[U(1.37), V(18.285)], [U(9.6), V(18.285)]], w, lw);
      st.line([[U(5.485), V(5.485)], [U(5.485), V(18.285)]], w, lw);
      st.line([[U(5.485), V(0)], [U(5.485), V(.3)]], w, lw); st.line([[U(5.485), V(23.47)], [U(5.485), V(23.77)]], w, lw);
      const k = 1 - Math.pow(.002, (now - (draw.t || now)) / 1000); draw.t = now;
      G.pl.forEach(p => ease(p, Math.min(1, k * 1.4)));
      ballAt(G.ball, now);
      const net = () => {
        st.fill([[U(-.9), NETV, 0], [U(-.9), NETV, 1.07], [U(5.485), NETV, .914], [U(11.87), NETV, 1.07], [U(11.87), NETV, 0]], "rgba(15,20,30,.45)");
        st.line([[U(-.9), NETV, 1.07], [U(5.485), NETV, .914], [U(11.87), NETV, 1.07]], "#fff", lw * 1.6);
        st.line([[U(-.9), NETV, 0], [U(-.9), NETV, 1.07]], "#ddd", lw * 1.4); st.line([[U(11.87), NETV, 0], [U(11.87), NETV, 1.07]], "#ddd", lw * 1.4);
      };
      const far = G.pl[1], near = G.pl[0], bFar = G.ball.v < NETV;
      st.player(far.u, far.v, CA, NA.charAt(0), G.server === 1 && !G.done, 11);
      if (bFar) st.ball(G.ball.u, G.ball.v, G.ball.z, "#DDF23A", 3.2, "#6b7a10");
      net();
      if (!bFar) st.ball(G.ball.u, G.ball.v, G.ball.z, "#DDF23A", 3.2, "#6b7a10");
      st.player(near.u, near.v, CH, NH.charAt(0), G.server === 0 && !G.done, 11);
    }
    function many() {
      let a = 0; const sc = {};
      for (let i = 0; i < 10000; i++) { const r = finish({ pts: [0, 0], games: [0, 0], sets: [], server: Math.random() < .5 ? 0 : 1 }); if (r.winner === 0) a++; const w = r.winner, k = nmS(w) + " " + r.sets.filter(s => s[w] > s[1 - w]).length + "-" + r.sets.filter(s => s[w] < s[1 - w]).length; sc[k] = (sc[k] || 0) + 1; }
      const rows = Object.entries(sc).sort((x, y) => y[1] - x[1]);
      return `<div class="bx-hda"><span style="width:${a / 100}%;background:${CH};color:#fff">${esc(NH)} ${Math.round(a / 100)} %</span><span style="width:${100 - a / 100}%;background:${CA};color:#0A1122">${Math.round(100 - a / 100)} % ${esc(NA)}</span></div>
        <div class="bx-sub">Scores en sets</div><div class="bx-chips">${rows.map(([k, v]) => `<span><b>${esc(k)}</b>${Math.round(v / 100)} %</span>`).join("")}</div>`;
    }
    reset();
    return R.begin();
  }

  // ================= NBA =================
  function nba(el, P) {
    const EF = [P.ea / 100, P.eb / 100], NH = short(P.h), NA = short(P.a);
    const out = team => { const e = EF[team] / 1.15, r = Math.random(); return r < .12 * e ? 3 : r < .54 * e ? 2 : 0; };
    const mu = t => 1.2 * EF[t] / 1.15, va = t => 2.76 * EF[t] / 1.15 - mu(t) * mu(t);
    // terrain : u = longueur (28 m), v = largeur (15 m) ; domicile attaque à droite
    const BU = 1.575 / 28, RIM = [[BU, .5], [1 - BU, .5]];
    // calage : au coup d'envoi, les chances affichées = celles du modèle
    let BIAS = 0;
    if (P.p > 0 && P.p < 1) { let lo = -6, hi = 6; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; Phi(m) < P.p ? lo = m : hi = m; } BIAS = lo * Math.sqrt(100 * (va(0) + va(1))) / 100 - (mu(0) - mu(1)); }
    let G;
    const fresh = () => ({ hs: 0, as: 0, poss: 0, q: 1, pc: 0, done: false, Q: [], qi: 0, ql: 1, holder: 0, fg: [[0, 0], [0, 0]], tp: [[0, 0], [0, 0]], reb: [0, 0], to: [0, 0],
      pl: Array.from({ length: 10 }, () => ({ u: .5, v: .5, tu: .5, tv: .5 })), ball: { u: .5, v: .5, z: 1, fu: .5, fv: .5, fz: 1, tu: .5, tv: .5, tz: 1, peak: 0, t0: 0, dur: 0 }, free: false });
    const R = shell(el, P, {
      base: 560,
      stage: { ratio: [.66, .5], cw: .92, far: .66, top: .22, bot: .05, g: .35, m: 28 },
      start: () => { if (G.done) reset(); }, reset: () => reset(), step: () => step(), draw: now => draw(now), many: () => many()
    });
    const st = R.st, nm = s => s ? NA : NH, col = s => s ? CA : CH;
    const LEN = q => q > 4 ? 20 : 50;
    const clock = () => { const len = LEN(G.q), per = (G.q > 4 ? 300 : 720) / len, secs = Math.max(0, Math.round((len - G.pc - G.qi / Math.max(1, G.ql)) * per)); return Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0"); };
    const head = () => R.hd(`<div class="bx-top"><div class="bx-team h" style="--c:${CH}"><b>${esc(NH)}</b><small>${esc(P.h)}</small></div><div class="bx-sc h" style="--c:${CH}">${G.hs}</div>
      <div class="bx-mid"><b>${G.done ? "FIN" : (G.q > 4 ? "PR" : "QT" + G.q) + " " + clock()}</b><small>${G.done ? "Terminé" : (G.poss ? NA : NH) + " · balle"}</small></div>
      <div class="bx-sc a" style="--c:${CA}">${G.as}</div><div class="bx-team a" style="--c:${CA}"><b>${esc(NA)}</b><small>${esc(P.a)}</small></div></div>`);
    const prob = () => {
      if (G.done) { R.wp(G.hs > G.as ? 1 : 0, G.hs > G.as ? 0 : 1); return; }
      const rem = Math.max(0, (Math.max(0, 4 - G.q) * 50 + (G.q <= 4 ? 50 - G.pc : 20 - G.pc)) / 2);
      const D = G.hs - G.as + rem * (mu(0) - mu(1) + BIAS), V = rem * (va(0) + va(1)) + 1e-6;
      const p = rem < .5 ? (G.hs > G.as ? 1 : G.hs < G.as ? 0 : .5) : Phi(D / Math.sqrt(V));
      R.wp(p, 1 - p);
    };
    const stats = () => R.stats([["Tirs réussis", G.fg[0][0], G.fg[1][0], null], ["Tirs à 3 pts", G.tp[0][0], G.tp[1][0]], ["Rebonds", G.reb[0], G.reb[1]], ["Pertes de balle", G.to[0], G.to[1]]].map(r => r));
    // positions d'attaque (vers le panier de droite), miroir pour l'autre équipe
    const OFF = [[.62, .5], [.76, .12], [.76, .88], [.87, .3], [.88, .7]];
    const setup = (team, jit = 1) => {
      const m = u => team ? 1 - u : u, rim = RIM[1 - team];
      for (let k = 0; k < 5; k++) {
        const o = G.pl[team * 5 + k], d = G.pl[(1 - team) * 5 + k];
        const u = OFF[k][0] + rnd(-.03, .03) * jit, v = Math.min(.95, Math.max(.05, OFF[k][1] + rnd(-.07, .07) * jit));
        o.tu = m(u); o.tv = v; d.tu = o.tu + (rim[0] - o.tu) * .25; d.tv = v + (rim[1] - v) * .25;
      }
    };
    function reset() { G = fresh(); setup(0, 0); G.pl.forEach(p => { p.u = p.tu; p.v = p.tv; }); G.ball.u = G.pl[0].u; G.ball.v = G.pl[0].v; R.call = null; head(); stats(); prob(); R.tick("", "", "Touche ▶ pour lancer le match."); R.q(".bx-mres").innerHTML = ""; }
    const toHolder = (k, ms = 380, peak = .6) => { const p = G.pl[G.poss * 5 + k]; G.holder = G.poss * 5 + k; fly(G.ball, p.tu, p.tv, peak, ms, R, 1); };
    function plan() {
      const t = G.poss, pts = out(t), r = Math.random(), rim = RIM[1 - t];
      let kind = pts === 3 ? "three" : pts === 2 ? (r < .15 ? "putback" : r < .3 ? "dunk" : r < .65 ? "layup" : "mid") : (r < .25 ? "tov" : r < .53 ? "miss3" : "miss2");
      const Q = [];
      Q.push(() => { setup(t); toHolder(0, 450, .8); });
      const passes = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < passes; i++) Q.push(() => { setup(t); let k; do k = Math.floor(Math.random() * 5); while (G.poss * 5 + k === G.holder); if (i === passes - 1 && (kind === "three" || kind === "miss3")) k = pick([1, 2]); toHolder(k); });
      const shoot = (peak, ms) => fly(G.ball, rim[0], rim[1], peak, ms, R, 3.05);
      const sh = () => G.pl[G.holder];
      if (kind === "tov") {
        Q.push(() => { const d = G.pl[(1 - t) * 5 + Math.floor(Math.random() * 5)]; fly(G.ball, d.tu, d.tv, .3, 260, R, 1); G.to[t]++; R.setCall(d.tu, d.tv, 1, nm(1 - t), "Interception", col(1 - t)); R.tick(nm(t), col(t), tr("Perte de balle")); });
      } else if (kind === "layup" || kind === "dunk") {
        Q.push(() => { const p = sh(); p.tu = rim[0] + (t ? .05 : -.05); p.tv = rim[1] + rnd(-.08, .08); fly(G.ball, p.tu, p.tv, .3, 380, R, 1); });
        Q.push(() => { shoot(kind === "dunk" ? .2 : .8, 300); R.setCall(rim[0], rim[1], 3, nm(t), kind === "dunk" ? "Dunk" : "Lay-up", col(t)); });
      } else if (kind === "putback") {
        Q.push(() => { shoot(3.5, 620); R.setCall(sh().u, sh().v, 1, nm(t), "Tir", col(t), 900); });
        Q.push(() => { const p = G.pl[t * 5 + 3]; p.tu = rim[0] + (t ? .04 : -.04); p.tv = .52; G.holder = t * 5 + 3; fly(G.ball, p.tu, p.tv, .8, 300, R, 2.2); G.reb[t]++; R.setCall(p.tu, p.tv, 2, nm(t), "Rebond offensif", col(t), 1000); G.fg[t][1]++; });
        Q.push(() => { shoot(.4, 260); R.setCall(rim[0], rim[1], 3, nm(t), "Claquette", col(t)); });
      } else {
        const three = kind === "three" || kind === "miss3";
        Q.push(() => { shoot(three ? 5 : 4, three ? 820 : 680); R.setCall(sh().u, sh().v, 1, nm(t), three ? "Tir à 3 pts" : "Tir", col(t), 1100); });
      }
      if (kind !== "tov") {
        Q.push(() => {
          const three = kind === "three" || kind === "miss3", made = pts > 0;
          G.fg[t][1]++; if (three) G.tp[t][1]++;
          if (made) {
            G.fg[t][0]++; if (three) G.tp[t][0]++;
            R.flash("+" + pts, col(t)); R.bump(t ? ".bx-sc.a" : ".bx-sc.h");
            const T = { three: "Panier à 3 points", dunk: "Dunk", layup: "Lay-up réussi", mid: "Tir à mi-distance réussi", putback: "Claquette après rebond" }[kind];
            R.tick(nm(t), col(t), tr(T)); fly(G.ball, rim[0], rim[1], 0, 250, R, 0);
          } else {
            const d = G.pl[(1 - t) * 5 + pick([3, 4])]; d.tu = rim[0] + (t ? -.05 : .05); d.tv = rim[1] + rnd(-.1, .1);
            fly(G.ball, d.tu, d.tv, 1.2, 380, R, 2.2); G.reb[1 - t]++;
            R.setCall(d.tu, d.tv, 2, nm(1 - t), "Rebond", col(1 - t)); R.tick(nm(t), col(t), tr(three ? "Tir à 3 points raté" : "Tir raté"));
          }
        });
      }
      Q.push(() => endPoss(pts));
      return Q;
    }
    function endPoss(pts) {
      if (G.poss === 0) G.hs += pts; else G.as += pts;
      G.pc++;
      if (G.pc >= LEN(G.q)) {
        if (G.q >= 4 && G.hs !== G.as) { G.done = true; R.setRun(false); R.tick("", "", `${tr("Fin du match")} · ${NH} ${G.hs}-${G.as} ${NA}`); R.flash(`${G.hs} – ${G.as}`, "#fff"); }
        else { G.q++; G.pc = 0; R.tick("", "", tr(G.q > 4 ? "Prolongation" : "Fin du quart-temps") + ` · ${G.hs}-${G.as}`); }
      }
      G.poss = 1 - G.poss; head(); stats(); prob();
    }
    function step() {
      if (G.done) return;
      if (!G.Q.length) { G.Q = plan(); G.ql = G.Q.length; G.qi = 0; }
      G.Q.shift()(); G.qi++; head();
    }
    function draw(now) {
      const c = st.ctx; c.clearRect(0, 0, st.W, st.H);
      st.fill(st.rect(-.04, -.08, 1.04, 1.08), "#5E3A22");
      // parquet
      const [x0, y0] = st.p(.5, 0), [, y1] = st.p(.5, 1), gr = c.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, "#B57A45"); gr.addColorStop(1, "#D29A5C");
      st.fill(st.rect(0, 0, 1, 1), gr);
      for (let i = 1; i < 22; i++) st.line([[0, i / 22], [1, i / 22]], "rgba(70,35,10,.10)", 1);
      const w = "rgba(255,255,255,.88)", lw = Math.max(1.2, st.W / 340);
      [0, 1].forEach(sd => {
        const f = u => sd ? 1 - u : u, c0 = sd ? "rgba(242,181,38,.55)" : "rgba(61,123,234,.55)";
        st.fill([[f(0), .3367], [f(5.8 / 28), .3367], [f(5.8 / 28), .6633], [f(0), .6633]], c0);
        st.line([[f(0), .3367], [f(5.8 / 28), .3367], [f(5.8 / 28), .6633], [f(0), .6633]], w, lw);
        st.line(st.arc(f(5.8 / 28), .5, (sd ? -1 : 1) * 1.8 / 28, 1.8 / 15, -Math.PI / 2, Math.PI / 2, 20), w, lw);
        const a = Math.asin(6.6 / 6.75), arc = st.arc(BU, .5, 6.75 / 28, 6.75 / 15, -a, a, 40).map(([u, v]) => [f(u), v]);
        st.line([[f(0), .06], ...arc, [f(0), .94]], w, lw);
      });
      st.line(st.rect(0, 0, 1, 1), w, lw); st.line([[.5, 0], [.5, 1]], w, lw);
      st.fill(st.arc(.5, .5, 1.8 / 28, 1.8 / 15, 0, 6.3), "rgba(10,17,34,.35)"); st.line(st.arc(.5, .5, 1.8 / 28, 1.8 / 15, 0, 6.3), w, lw);
      const hoop = sd => {
        const u = sd ? 1 - BU : BU, bu = sd ? 1 - 1.2 / 28 : 1.2 / 28;
        st.line([[sd ? 1.03 : -.03, .5, 0], [sd ? 1.03 : -.03, .5, 3.3], [bu, .5, 3.3]], "#9AA3B2", lw * 1.6);
        st.fill([[bu, .44, 2.9], [bu, .56, 2.9], [bu, .56, 3.95], [bu, .44, 3.95]], "rgba(255,255,255,.85)");
        st.line(st.arc(u, .5, .23 / 28, .23 / 15, 0, 6.3, 20).map(([a, b]) => [a, b, 3.05]), "#F06A1A", lw * 1.8);
      };
      const k = 1 - Math.pow(.003, (now - (draw.t || now)) / 1000); draw.t = now;
      G.pl.forEach(p => ease(p, Math.min(1, k * 1.5)));
      const kb = ballAt(G.ball, now);
      if (kb >= 1 && G.ball.tz === 1 && G.holder != null) { const h = G.pl[G.holder]; G.ball.u = h.u + .006; G.ball.v = h.v + .012; G.ball.fu = G.ball.tu = G.ball.u; G.ball.fv = G.ball.tv = G.ball.v; }
      hoop(0);
      const order = G.pl.map((p, i) => i).sort((a, b) => G.pl[a].v - G.pl[b].v);
      let bd = false;
      order.forEach(i => { const p = G.pl[i]; if (!bd && G.ball.v < p.v) { st.ball(G.ball.u, G.ball.v, G.ball.z, "#F28C28", 4.4, "#5A2A0A"); bd = true; } st.player(p.u, p.v, i < 5 ? CH : CA, String([1, 2, 3, 4, 5][i % 5]), i === G.holder, 10); });
      if (!bd) st.ball(G.ball.u, G.ball.v, G.ball.z, "#F28C28", 4.4, "#5A2A0A");
      hoop(1);
    }
    const quickGame = () => { let a = 0, b = 0; for (let i = 0; i < 100; i++) { a += out(0); b += out(1); } while (a === b) for (let i = 0; i < 10; i++) { a += out(0); b += out(1); } return [a, b]; };
    function many() {
      let h = 0, ta = 0, tb = 0, close = 0;
      for (let i = 0; i < 10000; i++) { const [a, b] = quickGame(); if (a > b) h++; ta += a; tb += b; if (Math.abs(a - b) <= 5) close++; }
      return `<div class="bx-hda"><span style="width:${h / 100}%;background:${CH};color:#fff">${esc(NH)} ${Math.round(h / 100)} %</span><span style="width:${100 - h / 100}%;background:${CA};color:#0A1122">${Math.round(100 - h / 100)} % ${esc(NA)}</span></div>
        <div class="bx-chips"><span><b>Score moyen</b>${Math.round(ta / 10000)} – ${Math.round(tb / 10000)}</span><span><b>Écart de 5 pts ou moins</b>${Math.round(close / 100)} %</span></div>`;
    }
    reset();
    return R.begin();
  }

  // ---------------- montage dans chaque onglet ----------------
  const RUN = { foot, tennis, nba };
  const SPOTS = [["foot", "ftResult", () => window.FootAPI && window.FootAPI.current()], ["nba", "nbResult", () => window.NbaAPI && window.NbaAPI.current()], ["tennis", "result", () => window.TennisAPI && window.TennisAPI.current()]];
  let stop = null, openEl = null;
  const label = open => open ? "Fermer" : "▶ Voir le match";
  const stopAll = () => { if (stop) stop(); stop = null; if (openEl) { openEl.innerHTML = ""; openEl.closest(".sm-card").classList.remove("open"); openEl = null; } document.querySelectorAll(".sm-open").forEach(b => b.textContent = label(false)); };
  SPOTS.forEach(([sport, rid, get]) => {
    const res = document.getElementById(rid); if (!res) return;
    const host = res.closest(".card"); if (!host) return;
    const card = document.createElement("section");
    card.className = "card sm-card";
    card.innerHTML = `<div class="sm-head"><h2>Simulation du match</h2><button class="sm-btn sm-main sm-open">${label(false)}</button></div><div class="sm-body"></div>`;
    host.insertAdjacentElement("afterend", card);
    const body = card.querySelector(".sm-body"), ob = card.querySelector(".sm-open");
    ob.onclick = () => {
      if (openEl === body) { stopAll(); return; }
      stopAll();
      const P = get(); if (!P) return;
      card.classList.add("open"); openEl = body; ob.textContent = label(true);
      stop = RUN[sport](body, P);
      card.scrollIntoView({ behavior: "smooth", block: "start" });
    };
  });
  document.addEventListener("change", e => { if (!e.target.closest(".sm-card")) stopAll(); });
  document.addEventListener("click", e => { if (e.target.closest(".game, .swap, .seg, #tabs, .tabs")) stopAll(); });
  addEventListener("hashchange", stopAll);
})();
</script>
