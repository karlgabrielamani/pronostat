  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const NUM = "(\\d[\\d\\s\\u202f.,]*\\d|\\d)";
  const RULES = LANG === "fr" ? [] : D.map(r => ({ len: r[0].length, re: new RegExp("(?<![A-Za-zÀ-ÿ'])" + esc(r[0]).replace(/#/g, NUM) + "(?![A-Za-zÀ-ÿ])", "g"), to: (LANG === "en" ? r[1] : r[2]).replace(/#/g, () => "$" + (++r.k || (r.k = 1))) }))
    .sort((a, b) => b.len - a.len);
  // numérotation des « # » de chaque traduction : $1, $2… dans l'ordre
  D.forEach(r => delete r.k);
  const tr = s => { if (!s || LANG === "fr") return s; let o = s; if (/[A-Za-zÀ-ÿ]/.test(o)) for (const r of RULES) o = o.replace(r.re, r.to); if (LANG === "en") o = o.replace(/(\d),(\d{1,2})(?!\d)/g, "$1.$2"); return o; };
  const done = new WeakMap();
  function walk(root) {
    if (LANG === "fr") return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = []; let n; while ((n = w.nextNode())) nodes.push(n);
    for (const t of nodes) {
      const p = t.parentNode; if (!p || /^(SCRIPT|STYLE)$/.test(p.nodeName)) continue;
      if (done.get(t) === t.nodeValue) continue;
      const v = tr(t.nodeValue); if (v !== t.nodeValue) t.nodeValue = v; done.set(t, t.nodeValue);
    }
    const els = root.querySelectorAll ? root.querySelectorAll("[aria-label],[title],[placeholder]") : [];
    for (const e of els) for (const a of ["aria-label", "title", "placeholder"]) { const v = e.getAttribute(a); if (v) { const x = tr(v); if (x !== v) e.setAttribute(a, x); } }
  }
  function switcher() {
    const bar = document.querySelector(".appbar"); if (!bar || bar.querySelector(".lang")) return;
    const box = document.createElement("div"); box.className = "lang"; box.setAttribute("role", "group"); box.setAttribute("aria-label", "Langue / Language / Taal");
    box.innerHTML = ["fr", "en", "nl"].map(l => `<button type="button" data-l="${l}" aria-pressed="${l === LANG}">${l.toUpperCase()}</button>`).join("");
    box.onclick = e => { const b = e.target.closest("button"); if (!b || b.dataset.l === LANG) return; try { localStorage.setItem("pronostat-lang", b.dataset.l); } catch (x) {} location.reload(); };
    const day = bar.querySelector(".day"); bar.insertBefore(box, day ? day.nextSibling : null);
  }
  document.addEventListener("DOMContentLoaded", () => {
    switcher();
    if (LANG === "fr") return;
    walk(document.body);
    let pending = false;
