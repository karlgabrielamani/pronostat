<style>
.sbtn { margin-left: auto; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.appbar .sbtn + .lang { margin-left: 0; }
.srch { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.srch[hidden] { display: none; }
.srch-bar { max-width: 760px; width: 100%; margin: 12px auto 8px; display: flex; gap: 8px; align-items: center; }
.srch-bar label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line2); border-radius: 14px; padding: 0 12px; height: 48px; }
.srch-bar input { flex: 1; min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; font: inherit; font-size: 17px; color: var(--ink); }
.srch-bar button { flex: none; font: inherit; font-weight: 700; font-size: 15px; border: 0; background: transparent; color: var(--hot); cursor: pointer; padding: 8px 4px; }
.srch-res { max-width: 760px; width: 100%; margin: 0 auto; overflow-y: auto; flex: 1; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.srch-h { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; margin: 14px 4px 6px; }
.srch-it { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; margin-bottom: 6px; cursor: pointer; color: var(--ink); }
.srch-it .sp { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--track); display: grid; place-items: center; color: var(--ink-2); }
.srch-it b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srch-it small { display: block; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srch-it > span:nth-child(2) { min-width: 0; flex: 1; }
.srch-it mark { background: transparent; color: var(--hot); }
.srch-empty { color: var(--ink-3); text-align: center; margin-top: 40px; font-size: 15px; }
</style>
<script>
// ---------- recherche d'une équipe, d'un joueur ou d'un match ----------
(() => {
  const bar = document.querySelector(".appbar"); if (!bar) return;
  const ICO = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  const SP = {
    Foot: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 4.5h-5L8 10z"/></svg>',
    Tennis: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6c3.5 3.5 3.5 9.3 0 12.8M18.4 5.6c-3.5 3.5-3.5 9.3 0 12.8"/></svg>',
    NBA: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.5 5.5c3 3 3 10 0 13M18.5 5.5c-3 3-3 10 0 13"/></svg>'
  };
  const btn = document.createElement("button");
  btn.className = "sbtn"; btn.type = "button"; btn.setAttribute("aria-label", "Rechercher"); btn.innerHTML = ICO;
  bar.appendChild(btn);
  const ov = document.createElement("div");
  ov.className = "srch"; ov.hidden = true; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-label", "Rechercher");
  ov.innerHTML = `<div class="srch-bar"><label>${ICO}<input type="search" placeholder="Équipe, joueur ou joueuse" autocomplete="off" enterkeyhint="search"></label><button type="button">Fermer</button></div><div class="srch-res"></div>`;
  document.body.appendChild(ov);
  const inp = ov.querySelector("input"), res = ov.querySelector(".srch-res");
  const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const hl = (s, q) => { const i = norm(s).indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length)); };
  let ENT = null, MAT = null, rows = [];
  const load = () => {
    if (ENT) return;
    const APIS = [window.FootAPI, window.TennisAPI, window.NbaAPI].filter(Boolean);
    ENT = APIS.flatMap(a => { try { return a.teams ? a.teams() : []; } catch (e) { return []; } }).map(x => ({ ...x, n: norm(x.name) }));
    const sod = new Date(); sod.setHours(0, 0, 0, 0);
    MAT = APIS.flatMap(a => { try { return a.list(); } catch (e) { return []; } })
      .filter(x => { const t = new Date(x.dt).getTime(); return t >= sod.getTime() && t < Date.now() + 7 * 864e5; })
      .sort((x, y) => new Date(x.dt) - new Date(y.dt)).map(x => ({ ...x, n: norm(x.a + " " + x.b) }));
  };
  const when = d => d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric" }) + " " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  function draw() {
    const q = norm(inp.value.trim());
    if (q.length < 2) { res.innerHTML = `<p class="srch-empty">Tapez au moins 2 lettres.</p>`; rows = []; return; }
    const score = n => n.startsWith(q) ? 0 : n.split(/[\s.-]+/).some(w => w.startsWith(q)) ? 1 : n.includes(q) ? 2 : 9;
    const m = MAT.filter(x => x.n.includes(q)).slice(0, 6);
    const e = ENT.map(x => ({ x, s: score(x.n) })).filter(o => o.s < 9).sort((a, b) => a.s - b.s || a.x.name.length - b.x.name.length).slice(0, 12).map(o => o.x);
    rows = [...m, ...e];
    if (!rows.length) { res.innerHTML = `<p class="srch-empty">Aucun résultat.</p>`; return; }
    let h = "";
    if (m.length) h += `<div class="srch-h">Prochains matchs</div>` + m.map((x, i) => `<button class="srch-it" data-i="${i}"><span class="sp">${SP[x.sport] || ""}</span><span><b>${hl(x.a, q)} – ${hl(x.b, q)}</b><small>${esc(when(new Date(x.dt)))} · ${esc(x.comp)}</small></span></button>`).join("");
    if (e.length) h += `<div class="srch-h">Équipes et joueurs</div>` + e.map((x, j) => `<button class="srch-it" data-i="${m.length + j}"><span class="sp">${SP[x.sport] || ""}</span><span><b>${hl(x.name, q)}</b><small>${esc(x.sub)}</small></span></button>`).join("");
    res.innerHTML = h;
  }
  const open = () => { load(); ov.hidden = false; inp.value = ""; draw(); setTimeout(() => inp.focus(), 30); document.body.style.overflow = "hidden"; };
  const close = () => { ov.hidden = true; document.body.style.overflow = ""; };
  btn.onclick = open;
  ov.querySelector(".srch-bar button").onclick = close;
  inp.addEventListener("input", draw);
  inp.addEventListener("keydown", e => { if (e.key === "Escape") close(); if (e.key === "Enter" && rows[0]) pick(0); });
  const pick = i => { const r = rows[i]; if (!r) return; close(); setTimeout(() => r.open(), 10); };
  res.addEventListener("click", e => { const b = e.target.closest(".srch-it"); if (b) pick(+b.dataset.i); });
})();
</script>
