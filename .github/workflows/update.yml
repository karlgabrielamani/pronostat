name: Mise à jour quotidienne
on:
  schedule:
    - cron: "39 5 * * *"   # chaque matin vers 6 h 39 (heure d'Amsterdam en hiver)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pandas==3.0.5 numpy==2.5.3 scipy==1.18.1
      - run: python src/update_all.py .
      - run: python src/make_site.py .
      - name: Garder la base des votes active (Supabase met en pause un projet gratuit après 7 jours sans activité)
        continue-on-error: true
        run: |
          curl -sS -m 30 -X POST "https://mueldojterubckckwytm.supabase.co/rest/v1/rpc/vote_counts" \
            -H "apikey: sb_publishable_bIVh_e0es-Ppb47ZjKtNJg_vIO-teLy" -H "Content-Type: application/json" -d '{"m":"keepalive"}'
      - name: Enregistrer
        run: |
          git config user.name "pronostat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html data
          git diff --cached --quiet || git commit -m "Mise à jour du $(date -u +%F)"
          git push
